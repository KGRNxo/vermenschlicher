name: Neues Sprachmuster
description: Ein auffälliges Schreibmuster, das die vorhandenen Regeln noch nicht erfassen.
labels: ["enhancement"]
body:
  - type: textarea
    id: before
    attributes:
      label: Ausgangstext
      description: Zeige ein echtes Beispiel. Bitte entferne vertrauliche Angaben.
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: Natürliche deutsche Formulierung
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Warum fehlt das Muster?
      description: Nenne die ähnlichste bestehende Regel und erkläre, was sie noch nicht abdeckt.
    validations:
      required: true

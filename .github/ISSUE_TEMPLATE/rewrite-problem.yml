name: Problem bei der Überarbeitung
description: Ein Muster ist stehen geblieben, die Bedeutung hat sich verändert oder der Text wurde zu stark bearbeitet.
labels: ["bug"]
body:
  - type: dropdown
    id: problem
    attributes:
      label: Was ist passiert?
      options:
        - Ein unnatürliches Muster ist geblieben
        - Ein Fakt wurde hinzugefügt oder ging verloren
        - Eine gute Formulierung wurde unnötig verändert
        - Anderes Problem
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Ausgangstext
      description: Entferne vertrauliche Informationen.
    validations:
      required: true
  - type: textarea
    id: call
    attributes:
      label: Aufruf
      description: Verwendeter Agent, Modell und genauer Auftrag.
      placeholder: "Claude Code, verwendetes Modell, /vermenschlicher:vermenschlicher"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Ergebnis
      description: Der ausgegebene Text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Ergebnis
      description: Nenne die fehlerhafte Stelle und eine bessere deutsche Formulierung. Wenn bekannt, die Musternummer angeben.
    validations:
      required: true
